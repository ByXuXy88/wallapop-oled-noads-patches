name: Build and release patches
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without v)
        default: '0.1.0'
        required: true
      publish:
        description: Publish this version as a GitHub release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}
      - name: Build Android MPP
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-0.1.0}"
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; fi
          python3 scripts/build.py --version "$version" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: wallapop-patches
          path: build/release/*
      - name: Publish GitHub release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="v${INPUT_VERSION:-0.1.0}"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/release/* --clobber
          else
            gh release create "$tag" build/release/* --target "$GITHUB_SHA" --title "Wallapop patches $tag" --notes-file CHANGELOG.md
          fi
      - name: Update root source metadata
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_metadata.py --file build/release/patches-bundle.json --branch main
